name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Fajita do instead?
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Concrete scenario where this helps
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This aligns with uptime monitoring (not a full observability platform request)
          required: true

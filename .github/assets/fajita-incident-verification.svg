  <text x="340" y="396" fill="#faf5ea" font-family="system-ui,sans-serif" font-size="13">Monitor healthy</text>
  <text x="340" y="416" fill="#faf5ea" opacity="0.55" font-family="system-ui,sans-serif" font-size="12">142 ms · HTTP 200</text>

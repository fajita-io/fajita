  <text x="744" y="296" fill="#faf5ea" opacity="0.75" font-family="system-ui,sans-serif" font-size="13">Required consecutive failures: 3</text>
  <text x="744" y="324" fill="#faf5ea" opacity="0.75" font-family="system-ui,sans-serif" font-size="13">Alerts held until confirmation</text>
  <rect x="720" y="464" width="440" height="256" rx="12" fill="#1f1a14" stroke="#faf5ea" stroke-opacity="0.08"/>
  <text x="744" y="496" fill="#faf5ea" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Notifications</text>
  <text x="744" y="532" fill="#faf5ea" opacity="0.55" font-family="system-ui,sans-serif" font-size="13">Slack · pending verification</text>
  <text x="744" y="560" fill="#faf5ea" opacity="0.55" font-family="system-ui,sans-serif" font-size="13">Email · pending verification</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Fajita open-source uptime monitoring. Websites, APIs, SSL, and cron jobs. Verifies failures before alerting.">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1280" y2="640">
      <stop offset="0%" stop-color="#faf6ef"/>
      <stop offset="55%" stop-color="#f6efe4"/>
      <stop offset="100%" stop-color="#efe4d4"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="78%" cy="72%" r="48%">
      <stop offset="0%" stop-color="#f5921b" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#e8590c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e8590c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf6ef"/>
    </linearGradient>
    <linearGradient id="heat-glow" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#f5921b" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#f5921b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f5921b" stop-opacity="0"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#17130e" flood-opacity="0.1"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#17130e" flood-opacity="0.06"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#17130e" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#hero-bg)"/>
  <rect width="1280" height="640" fill="url(#hero-glow)"/>
  <rect width="1280" height="568" fill="url(#grid)"/>

  <!-- Brand lockup -->
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="44" height="44" rx="11" stroke="#17130e" stroke-width="3" fill="none"/>
    <path d="M9 31h7.5L23 17.5 30.5 31H38" stroke="#17130e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="23" cy="11.5" r="3.5" fill="#d9480f"/>
    <text x="58" y="31" fill="#17130e" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="-0.02em">Fajita</text>
  </g>

  <!-- Left copy -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="156" fill="#c2410c" font-size="12" font-weight="600" letter-spacing="0.14em">OPEN SOURCE UPTIME MONITORING</text>
    <text x="72" y="214" fill="#17130e" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="-0.03em">
      <tspan x="72" dy="0">Catch outages before</tspan>
      <tspan x="72" dy="52">your customers do.</tspan>
    </text>
    <text x="72" y="318" fill="#44372c" font-size="19" font-weight="400">
      <tspan x="72" dy="0">Monitor websites, APIs, SSL certificates, and cron jobs.</tspan>
      <tspan x="72" dy="28">Fajita verifies trouble before it wakes anyone up.</tspan>
    </text>

    <!-- Monitor chips -->
    <g transform="translate(72 392)">
      <g>
        <rect width="118" height="36" rx="18" fill="#ffffff" stroke="#e7dcc8" stroke-width="1.5"/>
        <circle cx="22" cy="18" r="4" fill="#2f9e44"/>
        <text x="36" y="23" fill="#17130e" font-size="13" font-weight="600" letter-spacing="0.04em">HTTP</text>
      </g>
      <g transform="translate(130 0)">
        <rect width="118" height="36" rx="18" fill="#ffffff" stroke="#e7dcc8" stroke-width="1.5"/>
        <circle cx="22" cy="18" r="4" fill="#2f9e44"/>
        <text x="36" y="23" fill="#17130e" font-size="13" font-weight="600" letter-spacing="0.04em">API</text>
      </g>
      <g transform="translate(260 0)">
        <rect width="118" height="36" rx="18" fill="#ffffff" stroke="#e7dcc8" stroke-width="1.5"/>
        <circle cx="22" cy="18" r="4" fill="#2f9e44"/>
        <text x="36" y="23" fill="#17130e" font-size="13" font-weight="600" letter-spacing="0.04em">SSL</text>
      </g>
      <g transform="translate(390 0)">
        <rect width="118" height="36" rx="18" fill="#ffffff" stroke="#e7dcc8" stroke-width="1.5"/>
        <circle cx="22" cy="18" r="4" fill="#2f9e44"/>
        <text x="36" y="23" fill="#17130e" font-size="13" font-weight="600" letter-spacing="0.04em">CRON</text>
      </g>
    </g>
  </g>

  <!-- Thermal stack card -->
  <g transform="translate(668 48)" filter="url(#card-shadow)">
    <rect width="540" height="472" rx="28" fill="url(#card-fill)" stroke="#e7dcc8" stroke-width="1.5"/>
    <rect x="24" y="24" width="492" height="424" rx="20" fill="#faf6ef" stroke="#efe4d4" stroke-width="1"/>

    <!-- Thermal stack scene -->
    <g transform="translate(54 36) scale(0.92)">
      <!-- nodes -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.06em" fill="#44372c">
        <g>
          <line x1="120" y1="64" x2="120" y2="148" stroke="#f59f00" stroke-width="2" stroke-dasharray="3 9"/>
          <rect x="90" y="22" width="60" height="34" rx="10" fill="#ffffff" stroke="#e7dcc8" stroke-width="1.5"/>
          <circle cx="103" cy="39" r="3.5" fill="#f59f00"/>
          <text x="126" y="43.5" text-anchor="middle">HTTP</text>
        </g>
        <g>
          <line x1="208" y1="64" x2="208" y2="148" stroke="#f59f00" stroke-width="2" stroke-dasharray="3 9"/>
          <rect x="178" y="22" width="60" height="34" rx="10" fill="#ffffff" stroke="#e7dcc8" stroke-width="1.5"/>
          <circle cx="191" cy="39" r="3.5" fill="#f59f00"/>
          <text x="214" y="43.5" text-anchor="middle">API</text>
        </g>
        <g>
          <line x1="296" y1="64" x2="296" y2="148" stroke="#2f9e44" stroke-width="2" stroke-dasharray="3 9"/>
          <rect x="266" y="22" width="60" height="34" rx="10" fill="#ffffff" stroke="#e7dcc8" stroke-width="1.5"/>
          <circle cx="279" cy="39" r="3.5" fill="#2f9e44"/>
          <text x="302" y="43.5" text-anchor="middle">SSL</text>
        </g>
        <g>
          <line x1="384" y1="64" x2="384" y2="148" stroke="#2f9e44" stroke-width="2" stroke-dasharray="3 9"/>
          <rect x="354" y="22" width="60" height="34" rx="10" fill="#ffffff" stroke="#e7dcc8" stroke-width="1.5"/>
          <circle cx="367" cy="39" r="3.5" fill="#2f9e44"/>
          <text x="390" y="43.5" text-anchor="middle">CRON</text>
        </g>
      </g>

      <ellipse cx="240" cy="252" rx="200" ry="72" fill="url(#heat-glow)" opacity="0.42"/>
      <rect x="72" y="148" width="336" height="104" rx="24" fill="#ffffff" stroke="#d4c4ae" stroke-width="2"/>
      <rect x="72" y="148" width="336" height="104" rx="24" fill="#fbf0d3" opacity="0.55"/>
      <path d="M96 208Q108 198 120 208T144 208T168 208T192 208T216 208T240 208T264 198T288 208T312 218T336 208T360 208T384 208" stroke="#f59f00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="240" cy="128" r="6" fill="#c2410c"/>

      <!-- verify pulse ring -->
      <circle cx="240" cy="200" r="34" fill="none" stroke="#f59f00" stroke-width="2" stroke-opacity="0.35"/>
      <circle cx="240" cy="200" r="22" fill="none" stroke="#f59f00" stroke-width="1.5" stroke-opacity="0.55"/>
    </g>

    <!-- Card footer -->
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <rect x="40" y="372" width="160" height="28" rx="14" fill="#fbf0d3" stroke="#f59f00" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="58" cy="386" r="4" fill="#f59f00"/>
      <text x="72" y="391" fill="#92400e" font-size="12" font-weight="700" letter-spacing="0.06em">VERIFYING</text>
      <text x="40" y="430" fill="#44372c" font-size="14" font-weight="500">One failed check is not an incident yet.</text>
      <text x="40" y="452" fill="#6b5a4c" font-size="13">Fajita re-checks before Slack, email, or your status page.</text>
    </g>
  </g>

  <!-- Bottom flow strip -->
  <rect y="568" width="1280" height="72" fill="#17130e"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#faf6ef">
    <g transform="translate(160 592)">
      <circle cx="0" cy="0" r="16" fill="#2a231c" stroke="#faf5ea" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="11">1</text>
      <text x="0" y="34" text-anchor="middle" font-weight="500" fill="#faf5ea" fill-opacity="0.82">Scheduled check</text>
    </g>
    <path d="M222 592h112" stroke="#f5921b" stroke-width="2" stroke-linecap="round"/>
    <polygon points="334,588 346,592 334,596" fill="#f5921b"/>

    <g transform="translate(400 592)">
      <circle cx="0" cy="0" r="16" fill="#2a231c" stroke="#f59f00" stroke-opacity="0.65" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="11">2</text>
      <text x="0" y="34" text-anchor="middle" font-weight="500" fill="#faf5ea" fill-opacity="0.82">Failure detected</text>
    </g>
    <path d="M466 592h112" stroke="#f5921b" stroke-width="2" stroke-linecap="round"/>
    <polygon points="578,588 590,592 578,596" fill="#f5921b"/>

    <g transform="translate(640 592)">
      <circle cx="0" cy="0" r="16" fill="#3d2a12" stroke="#f5921b" stroke-opacity="0.85" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="11">3</text>
      <text x="0" y="34" text-anchor="middle" font-weight="600" fill="#f5921b">Verify first</text>
    </g>
    <path d="M706 592h112" stroke="#f5921b" stroke-width="2" stroke-linecap="round"/>
    <polygon points="818,588 830,592 818,596" fill="#f5921b"/>

    <g transform="translate(880 592)">
      <circle cx="0" cy="0" r="16" fill="#2a231c" stroke="#faf5ea" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="11">4</text>
      <text x="0" y="34" text-anchor="middle" font-weight="500" fill="#faf5ea" fill-opacity="0.82">Alert if confirmed</text>
    </g>
    <path d="M946 592h112" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85"/>
    <polygon points="1058,588 1070,592 1058,596" fill="#2f9e44" fill-opacity="0.85"/>

    <g transform="translate(1120 592)">
      <circle cx="0" cy="0" r="16" fill="#17301f" stroke="#2f9e44" stroke-opacity="0.65" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="11">5</text>
      <text x="0" y="34" text-anchor="middle" font-weight="500" fill="#faf5ea" fill-opacity="0.82">Status page update</text>
    </g>
  </g>
</svg>

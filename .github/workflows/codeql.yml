name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan for default-branch drift and new advisory rules.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: go
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go (worker extraction)
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            services/monitor-worker/go.sum
            packages/monitor-contracts/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.build-mode || 'none' }}

      - name: Setup Node (TypeScript extraction)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        if: matrix.language == 'javascript-typescript'
        run: npm ci

      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          (cd services/monitor-worker && go build ./...)
          (cd packages/monitor-contracts && go build ./...)

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

name: Deploy to Vercel

on:
  push:
    branches:
      - main

# Production deploy only from the canonical repository on main.
# Forks and pull requests never receive VERCEL_* secrets.
jobs:
  deploy:
    if: github.repository == 'fajita-io/fajita' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
